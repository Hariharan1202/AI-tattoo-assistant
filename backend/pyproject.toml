[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/azure_*.py",   # require live Azure credentials
    "app/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40
