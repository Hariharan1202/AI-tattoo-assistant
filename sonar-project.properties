sonar.projectKey=ink-ai
sonar.projectName=Ink AI — Tattoo Assistant
sonar.projectVersion=1.0.0

# Source roots
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib,frontend/store

# Test roots
sonar.tests=backend/tests,frontend/__tests__

# Language-specific inclusions
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage/backend-coverage.xml
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# Exclusions
sonar.exclusions=\
  backend/.venv/**,\
  backend/alembic/**,\
  frontend/node_modules/**,\
  frontend/.next/**,\
  **/__pycache__/**,\
  **/*.pyc

# Test file exclusions from coverage
sonar.coverage.exclusions=\
  backend/tests/**,\
  frontend/__tests__/**,\
  backend/app/services/azure_*.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate — fail on new issues
sonar.qualitygate.wait=true
